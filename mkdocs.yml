site_name: Password Audit
site_description: A modular toolkit for authorized Active Directory password auditing.
site_url: https://cspanias.github.io/password-audit/
repo_name: CSpanias/password-audit
repo_url: https://github.com/CSpanias/password-audit
strict: true

theme:
  name: material
  features:
    - content.code.copy
    - navigation.footer
    - navigation.instant
    - navigation.sections
    - navigation.tabs
    - navigation.top
    - search.highlight
    - search.suggest
    - toc.follow

  palette:
    - scheme: default
      toggle:
        icon: material/weather-night
        name: Switch to dark mode

    - scheme: slate
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode

plugins:
  - search
  - glightbox

markdown_extensions:
  - admonition
  - attr_list
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - toc:
      permalink: true

nav:
  - Overview: index.md
  - Getting Started:
      - Installation: installation.md
      - Workflow: knowledge-base/password-audits.md
  - Modules:
      - Audit (Recommended): audit.md
      - Organise: organise.md
      - Crack: crack.md
      - Analyse: analyse.md
      - LM: lm.md
  - Checks:
      - Overview: checks/index.md
      - Privileged Accounts: checks/privileged-accounts.md
      - LM Hashes: checks/lm-hashes.md
      - Password Length: checks/password-length.md
      - Password Reuse: checks/password-reuse.md
      - NTLM Hash Reuse: checks/ntlm-hash-reuse.md
      - Similarly Named Accounts: checks/similar-accounts.md
      - Username-Derived Passwords: checks/username-passwords.md
      - Organisation-Related Passwords: checks/organisation-passwords.md
      - Common Passwords: checks/common-passwords.md
      - Date-Related Passwords: checks/date-passwords.md
      - Keyboard Patterns: checks/keyboard-patterns.md
      - Password Statistics: checks/password-statistics.md
  - Wordlists and Rules: knowledge-base/wordlists-and-rules.md
      