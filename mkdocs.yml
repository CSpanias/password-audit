site_name: Password-Audit
site_description: Active Directory Password Auditing Framework
site_url: https://cspanias.github.io/password-audit/
repo_url: https://github.com/CSpanias/password-audit
strict: true

theme:
  name: material

  palette:
    - scheme: default
      toggle:
        icon: material/weather-night
        name: Switch to dark mode

    - scheme: slate
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode

plugins:
  - glightbox

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - toc:
      permalink: true

nav:
  - Home: index.md

  - User Guides:
      - Installation: installation.md
      - Development Guide: development.md
      - Future Ideas: ideas.md

  - Password Audit Modules:
      - Audit: audit.md
      - Organise: organise.md
      - Crack: crack.md
      - Analyse: analyse.md

  - LM Hashes: lm.md
      