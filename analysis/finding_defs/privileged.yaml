# ==============================================================================
# Privileged Account Findings
# ==============================================================================

domain-admin-passwords:
  id: DOMAIN-ADMIN-001
  title: Recovered Domain Administrator Passwords
  severity: critical
  category: privileged_accounts
  summary_label: Domain Admins
  summary_unit: accounts
  remediation: |
    Immediately reset passwords for all affected Domain Administrator accounts.
    Implement privileged access management (PAM), enforce multi-factor
    authentication (MFA), and apply dedicated password policies to privileged
    identities.
  description_template: "A total of {count} Domain Administrator password{s} {were_was} recovered."

privileged-passwords:
  id: PRIV-ACCOUNT-001
  title: Recovered Privileged Account Passwords
  severity: high
  category: privileged_accounts
  summary_label: Privileged
  summary_unit: accounts
  remediation: |
    Reset the affected account passwords, review privileged group membership,
    and protect privileged identities with strong, unique credentials and
    appropriate additional controls.
  description_template: "A total of {count} account{s} in selected privileged groups, excluding Domain Administrators, {were_was} found with {recovered_passwords}."

domain-admin-lm-hashes:
  id: DOMAIN-ADMIN-002
  title: Domain Administrator LM Hashes
  severity: critical
  category: legacy_auth
  summary_label: LM Admins
  summary_unit: accounts
  remediation: |
    Disable LAN Manager (LM) hash storage and require affected Domain Administrator accounts
    to change their passwords immediately. Prioritise privileged accounts for
    password reset and review for evidence of credential exposure or misuse.
  description_template: "A total of {count} Domain Administrator account{s} {were_was} found storing {lm_hashes}."