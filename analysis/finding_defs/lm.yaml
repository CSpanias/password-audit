# ==============================================================================
# LM Hash Findings
# ==============================================================================

lm-hashes-present:
  id: LM-AUTH-001
  title: LM Hashes Present
  severity: high
  category: legacy_auth
  remediation: |
    Disable LAN Manager (LM) hash storage and require affected users to change their passwords
    to ensure previously stored LM hashes are removed. Identify and remediate any
    legacy systems requiring LM compatibility.
  description_template: "A total of {count} account{s} {were_was} found storing LAN Manager (LM) password hashes."