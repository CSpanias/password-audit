# ==============================================================================
# LM Hash Findings
# ==============================================================================

lm-hashes-present:
  id: LM-AUTH-001
  title: LM Hashes Present
  severity: high
  category: legacy_auth
  summary_unit: accounts
  remediation: |
    Disable LM hash storage and require affected users to change their passwords
    to ensure previously stored LM hashes are removed. Identify and remediate any
    legacy systems requiring LM compatibility.
  description_template: "A total of {count} account{s} {were_was} found storing LM password hashes."