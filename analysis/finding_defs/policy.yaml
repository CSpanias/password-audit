# ==============================================================================
# Password Policy Findings
# ==============================================================================

non-compliant-passwords:
  id: PWD-POLICY-001
  title: Non-Compliant Passwords
  severity: medium
  category: password_policy
  summary_label: Non-Compliant
  summary_unit: recovered passwords
  remediation: |
    Enforce the configured minimum password length policy. Review accounts with
    non-compliant passwords and require password changes where passwords fall
    below the minimum length requirement.
  references:
    - https://pages.nist.gov/800-63-4/sp800-63b.html#length
  description_template: "A total of {count} password{s} did not comply with the configured minimum password length requirement."