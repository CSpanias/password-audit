# ==============================================================================
# Password Reuse Findings
# ==============================================================================

password-reuse:
  id: PWD-REUSE-001
  title: Password Reuse
  severity: high
  category: password_reuse
  summary_unit: unique passwords
  remediation: |
    Enforce unique passwords across all accounts. Require password changes for
    accounts sharing passwords and implement technical controls to prevent
    password reuse.
  description_template: "A total of {count} password{s} {were_was} reused across multiple unrelated accounts."

shared-account-passwords:
  id: PWD-REUSE-002
  title: Shared Passwords
  severity: high
  category: password_reuse
  summary_unit: account pairs
  remediation: |
    Investigate accounts sharing passwords with similarly named accounts. Require
    password changes and review for evidence of credential compromise or shared
    account usage.
  description_template: "A total of {count} password{s} {were_was} shared across similarly named accounts."

ntlm-hash-reuse:
  id: PWD-REUSE-003
  title: Password Reuse Identified from NTLM Hashes
  severity: high
  category: password_reuse
  summary_unit: shared credential groups
  remediation: |
    Review the affected accounts and replace shared passwords with unique
    credentials. Prioritise accounts in privileged groups and review
    credential separation between privileged and other accounts.
  description_template: "A total of {count} shared NTLM credential group{s} {were_was} identified across enabled user accounts, including passwords that may not have been recovered. These results may overlap with recovered-password reuse findings."

hibp-passwords:
  id: PWD-BREACH-001
  title: Passwords Found in Known Breach Data
  severity: high
  category: password_reuse
  summary_unit: accounts
  remediation: |
    Reset the passwords of affected accounts, prioritising privileged accounts,
    and require strong, unique replacements. Screen new passwords against a
    regularly updated compromised-password blocklist.
  description_template: "A total of {count} enabled user account{s} {were_was} using passwords whose NTLM hashes matched the local Have I Been Pwned Pwned Passwords dataset. A match does not establish that the account itself appeared in a breach."