[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "password-audit"
version = "0.1.0"
description = "Active Directory password audit framework"
readme = "README.md"
requires-python = ">=3.10"

[project.scripts]
password-audit = "cli.main:main"

[tool.setuptools.packages.find]
include = [
    "cli",
    "common",
    "ntds",
    "analyse",
    "reports",
    "cracking",
]