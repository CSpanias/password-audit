[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "password-audit"
version = "1.1.0"
description = "Active Directory password audit framework"
license = {text = "MIT"}
readme = "README.md"
requires-python = ">=3.10"

dependencies = [
    "PyYAML>=6.0",
    "rich>=13.0.0",
    "rich-argparse>=1.7.1",
]

[project.scripts]
password-audit = "cli.main:main"

[tool.setuptools.packages.find]
include = [
    "cli",
    "common",
    "ntds",
    "analysis",
    "analysis.finding_defs",
    "reports",
    "cracking",
    "auditing",
    "lm"
]

[tool.setuptools.package-data]
analysis = ["finding_defs/*.yaml"]

[project.optional-dependencies]
docs = [
    "mkdocs-material",
    "mkdocs-glightbox",
]